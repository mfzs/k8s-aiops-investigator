apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-aiops-investigator
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-aiops-investigator-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-aiops-investigator-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-aiops-investigator-readonly
subjects:
  - kind: ServiceAccount
    name: k8s-aiops-investigator
    namespace: aiops

